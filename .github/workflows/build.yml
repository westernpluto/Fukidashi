name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o Fukidashi.zip

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        working-directory: Fukidashi
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: Fukidashi
        run: |
          xcodebuild -project Fukidashi.xcodeproj -scheme Fukidashi \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -40; exit 1; }

      - name: Package IPA
        working-directory: Fukidashi
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fukidashi.app Payload/
          zip -qry Fukidashi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Fukidashi-ipa
          path: Fukidashi/Fukidashi.ipa
