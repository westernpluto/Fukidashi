name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (when uploaded as Fukidashi.zip)
        run: if [ -f Fukidashi.zip ]; then unzip -q -o Fukidashi.zip; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          cd "$( [ -f Fukidashi/project.yml ] && echo Fukidashi || echo . )"
          bash ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Fukidashi-ipa
          path: "**/Fukidashi.ipa"
